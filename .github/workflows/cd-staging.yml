name: CD Pipeline - Staging and Cleanup

on:
  push:
    branches:
      - 'testing'
  # workflow_call:
  # workflow_run:
  #   workflows: ["CI Pipeline - Test, Build and Push Images to ACR"]
  #   types:
  #     - completed
  

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_STAGING_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  PRODUCT_API_URL: ${{ steps.deploy_to_staging.outputs.product_api_url }}
  ORDER_API_URL: ${{ steps.deploy_to_staging.outputs.order_api_url }}
  CUSTOMER_API_URL: ${{ steps.deploy_to_staging.outputs.customer_api_url }}
  RESOURCE_GROUP_NAME : deakinuni
  AKS_NAME : 224917579


jobs:
  deploy_to_staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Azure Login for ACR
        run: |
          az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

      - name: Set AKS credentials
        run: |
          az aks get-credentials --name ${{ env.AKS_NAME }} --resource-group ${{ env.RESOURCE_GROUP_NAME }}

      - name: Create staging namespace
        run: |
          kubectl create namespace staging || echo "Staging namespace already exists"

      - name: Deploy product_service to Staging namespace
        id: product_service
        run: |
          kubectl apply -f ./kubernetes/product_service_deployment.yaml -n staging
          echo "::set-output name=product_api_url::$(kubectl get svc product-service -n staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"

      - name: Deploy order_service to Staging namespace
        id: order_service
        run: |
          kubectl apply -f ./kubernetes/order_service_deployment.yaml -n staging
          echo "::set-output name=order_api_url::$(kubectl get svc order-service -n staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"

      - name: Deploy customer_service to Staging namespace
        id: customer_service
        run: |
          kubectl apply -f ./kubernetes/customer_service_deployment.yaml -n staging
          echo "::set-output name=customer_api_url::$(kubectl get svc customer-service -n staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"

      - name: Deploy frontend with injected API URLs
        run: |
          # Replace the placeholders in main.js with actual API URLs
          sed -i "s|PRODUCT_API_BASE_URL = '';|PRODUCT_API_BASE_URL = '${{ steps.deploy_to_staging.outputs.product_api_url }}';|g" ./frontend/main.js
          sed -i "s|ORDER_API_BASE_URL = '';|ORDER_API_BASE_URL = '${{ steps.deploy_to_staging.outputs.order_api_url }}';|g" ./frontend/main.js
          sed -i "s|CUSTOMER_API_BASE_URL = '';|CUSTOMER_API_BASE_URL = '${{ steps.deploy_to_staging.outputs.customer_api_url }}';|g" ./frontend/main.js

          # Build and push the frontend Docker image
          docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}/frontend:latest ./frontend
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}/frontend:latest

      - name: Deploy frontend to Staging namespace
        run: |
          kubectl apply -f ./kubernetes/frontend_deployment.yaml -n staging

      - name: Get frontend external IP
        id: get_frontend_ip
        run: |
          FRONTEND_IP=$(kubectl get svc frontend-service -n staging -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Frontend service is available at: $FRONTEND_IP"
          echo "::set-output name=frontend_ip::$FRONTEND_IP"

      - name: Display Frontend IP
        run: |
          echo "Frontend service is now available at: ${{ steps.get_frontend_ip.outputs.frontend_ip }}"

      - name: Wait for manual acceptance testing (e.g., 5 minutes)
        run: |
          echo "Staging environment is ready at http://${{ env.STAGING_IP_ADDRESS }}. You have 5 minutes to perform manual tests."
          sleep 300 # Wait for 5 minutes

  destroy_staging:
    runs-on: ubuntu-latest
    needs: deploy_frontend
    if: success()
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete staging namespace
        run: |
          kubectl delete namespace staging